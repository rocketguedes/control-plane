apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lldap
  labels:
    app.kubernetes.io/name: lldap
    app.kubernetes.io/instance: lldap
    app.kubernetes.io/component: lldap
spec:
  parentRefs:
    - name: cilium-gateway-system
      namespace: kube-system
      port: 443
  hostnames:
    - id.guedescloud.com.br
  rules:
    - backendRefs:
        - name: lldap-service
          port: 17170
      matches:
        - path:
            type: PathPrefix
            value: /
