apiVersion: v1
kind: Service
metadata:
  name: blocky
  labels:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
spec:
  ipFamilyPolicy: PreferDualStack
  clusterIP: 10.43.0.53
  clusterIPs:
    - 10.43.0.53
    - fd43::53
  selector:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
  ports:
    - name: dns-tcp
      appProtocol: domain
      protocol: TCP
      port: 53
      targetPort: dns-tcp
    - name: dns-udp
      appProtocol: domain
      protocol: UDP
      port: 53
      targetPort: dns-udp
    - name: http
      appProtocol: http
      protocol: TCP
      port: 4000
      targetPort: http
