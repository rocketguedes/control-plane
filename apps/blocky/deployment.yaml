apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
  labels:
    app.kubernetes.io/name: blocky
    app.kubernetes.io/instance: blocky
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
      app.kubernetes.io/instance: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocky
        app.kubernetes.io/instance: blocky
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "4000"
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: blocky
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 100
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky
          envFrom:
            - configMapRef:
                name: blocky
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 4000
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              readOnly: true
              subPath: config.yml
            - name: cache
              mountPath: /app/cache
            - name: logs
              mountPath: /logs
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          startupProbe:
            exec:
              command:
                - /app/blocky
                - healthcheck
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            exec:
              command:
                - /app/blocky
                - healthcheck
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /app/blocky
                - healthcheck
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: blocky-config
        - name: cache
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
