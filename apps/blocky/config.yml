# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json
upstreams:
  init:
    strategy: fast
  strategy: parallel_best
  timeout: 1s
  groups:
    default:
      - quic:dns.quad9.net:853
      - tcp-tls:149.112.112.112:853
      - tcp-tls:[2620:fe::fe]:853
      - tcp-tls:1.0.0.1:853
      - tcp-tls:[2606:4700:4700::1001]:853

connectIPVersion: dual

conditional:
  mapping:
    cluster.local: 10.43.0.10,fd43::a

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.plus.txt
    malware:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.txt
    gambling:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/gambling.txt
    referral:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/blocklist-referral-onlydomains.txt
    trackers:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.tiktok.txt
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.winoffice.txt
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/native.samsung.txt
  clientGroupsBlock:
    default:
      - ads
      - malware
      - gambling
      - referral
      - trackers
  blockType: zeroIp
  loading:
    refreshPeriod: 4h
    strategy: fast
    downloads:
      timeout: 60s
      cachePath: /app/cache

caching:
  minTime: 15m
  maxTime: 0m
  prefetching: true
  prefetchExpires: 4h
  prefetchThreshold: 2

prometheus:
  enable: true
  path: /metrics

ports:
  dns: 53
  http: 4000

log:
  level: info
  format: text
  timestamp: true
