# yaml-language-server: $schema=https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/config.schema.json
upstreams:
  init:
    strategy: fast
  strategy: parallel_best
  timeout: 1s
  groups:
    default:
      - tcp-tls:1.1.1.1:853
      - tcp-tls:1.0.0.1:853
      - tcp-tls:[2606:4700:4700::1111]:853
      - tcp-tls:[2606:4700:4700::1001]:853
      - tcp-tls:9.9.9.9:853
      - tcp-tls:149.112.112.112:853
      - tcp-tls:[2620:fe::fe]:853
      - tcp-tls:[2620:fe::9]:853

connectIPVersion: dual

conditional:
  mapping:
    cluster.local: 10.43.0.10,fd43::a

blocking:
  denylists:
    ads:
      - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro.txt
  clientGroupsBlock:
    default:
      - ads
  blockType: zeroIp
  loading:
    refreshPeriod: 4h
    strategy: fast
    downloads:
      cachePath: /app/cache

caching:
  minTime: 15m
  maxTime: 0
  prefetching: true
  prefetchExpires: 4h
  prefetchThreshold: 2

prometheus:
  enable: true
  path: /metrics

queryLog:
  type: postgresql
  target: postgres://blocky@postgresql-rw.postgresql.svc.cluster.local:5432/blocky?sslmode=disable
  logRetentionDays: 7

ports:
  dns: 53
  http: 4000

log:
  level: info
  format: text
  timestamp: true
