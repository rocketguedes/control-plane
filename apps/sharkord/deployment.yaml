apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharkord
  labels:
    app.kubernetes.io/name: sharkord
    app.kubernetes.io/instance: sharkord
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sharkord
      app.kubernetes.io/instance: sharkord
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sharkord
        app.kubernetes.io/instance: sharkord
    spec:
      serviceAccountName: sharkord
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sharkord
          image: docker.io/sharkord/sharkord
          envFrom:
            - configMapRef:
                name: sharkord
            - secretRef:
                name: sharkord
          ports:
            - name: http
              containerPort: 4991
              protocol: TCP
            - name: webrtc-tcp
              containerPort: 40000
              hostPort: 40000
              protocol: TCP
            - name: webrtc-udp
              containerPort: 40000
              hostPort: 40000
              protocol: UDP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sharkord
        - name: tmp
          emptyDir: {}
