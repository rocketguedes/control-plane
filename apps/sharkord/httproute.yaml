apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sharkord
  labels:
    app.kubernetes.io/name: sharkord
    app.kubernetes.io/instance: sharkord
spec:
  parentRefs:
    - name: cilium-gateway-system
      namespace: kube-system
      port: 443
  hostnames:
    - chat.guedescloud.com.br
  rules:
    - backendRefs:
        - name: sharkord
          port: 4991
      matches:
        - path:
            type: PathPrefix
            value: /
