apiVersion: v1
kind: Service
metadata:
  name: sharkord
  labels:
    app.kubernetes.io/name: sharkord
    app.kubernetes.io/instance: sharkord
spec:
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: sharkord
    app.kubernetes.io/instance: sharkord
  ports:
    - name: http
      appProtocol: http
      protocol: TCP
      port: 4991
      targetPort: http
    - name: webrtc-tcp
      protocol: TCP
      port: 40000
      targetPort: webrtc-tcp
    - name: webrtc-udp
      protocol: UDP
      port: 40000
      targetPort: webrtc-udp
