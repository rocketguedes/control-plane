apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: audiomuse-ai-worker
  labels:
    app.kubernetes.io/name: audiomuse-ai
    app.kubernetes.io/instance: audiomuse-ai
    app.kubernetes.io/component: worker
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: audiomuse-ai
      app.kubernetes.io/instance: audiomuse-ai
      app.kubernetes.io/component: worker
  serviceName: audiomuse-ai-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audiomuse-ai
        app.kubernetes.io/instance: audiomuse-ai
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: audiomuse-ai
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-dependencies
          image: docker.io/library/busybox
          command:
            - sh
            - -c
            - for t in postgresql-rw.postgresql.svc.cluster.local:5432; do until nc -z -w 2 ${t%:*} ${t##*:}; do echo waiting for $t; sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: rq-worker
          image: ghcr.io/neptunehub/audiomuse-ai
          envFrom:
            - configMapRef:
                name: audiomuse-ai-config
            - secretRef:
                name: audiomuse-ai
          env:
            - name: SERVICE_TYPE
              value: worker
          volumeMounts:
            - name: app-temp-audio
              mountPath: /app/temp_audio
            - name: plugins-storage
              mountPath: /app/plugin/installed
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 2Gi
            limits:
              cpu: 1000m
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: app-temp-audio
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: plugins-storage
        labels:
          app.kubernetes.io/name: audiomuse-ai
          app.kubernetes.io/instance: audiomuse-ai
          app.kubernetes.io/component: worker
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
