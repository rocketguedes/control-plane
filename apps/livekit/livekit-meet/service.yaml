apiVersion: v1
kind: Service
metadata:
  name: livekit-meet
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/instance: livekit
    app.kubernetes.io/component: meet
spec:
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/instance: livekit
    app.kubernetes.io/component: meet
  ports:
    - name: http
      appProtocol: http
      protocol: TCP
      port: 80
      targetPort: http
