apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-server
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/instance: livekit
    app.kubernetes.io/component: server
data:
  LIVEKIT_CONFIG: |
    webhook:
      urls:
        - http://api.fluxer.svc.cluster.local:8080/webhooks/livekit
  LIVEKIT_LOGGING_LEVEL: info
  LIVEKIT_PORT: "7880"
  LIVEKIT_PROMETHEUS_PORT: "6789"
  LIVEKIT_RTC_TCP_PORT: "7881"
  LIVEKIT_RTC_UDP_PORT: "7882"
  LIVEKIT_RTC_USE_EXTERNAL_IP: "true"
  LIVEKIT_TURN_ENABLED: "false"
