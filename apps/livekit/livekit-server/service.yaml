apiVersion: v1
kind: Service
metadata:
  name: livekit-server
  labels:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/instance: livekit
    app.kubernetes.io/component: server
spec:
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: livekit
    app.kubernetes.io/instance: livekit
    app.kubernetes.io/component: server
  ports:
    - name: http
      appProtocol: http
      protocol: TCP
      port: 80
      targetPort: http
    - name: rtc-tcp
      protocol: TCP
      port: 7881
      targetPort: rtc-tcp
    - name: rtc-udp
      protocol: UDP
      port: 7882
      targetPort: rtc-udp
    - name: metrics
      protocol: TCP
      port: 6789
      targetPort: metrics
