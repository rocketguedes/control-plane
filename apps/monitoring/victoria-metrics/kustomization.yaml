apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - secret.yaml
  - service-prometheus.yaml
  - service-victoria-metrics.yaml
  - serviceaccount.yaml
  - statefulset.yaml
configMapGenerator:
  - name: victoria-metrics-single-server-scrapeconfig
    files:
      - prometheus.yml
images:
  - name: docker.io/victoriametrics/victoria-metrics
    newTag: v1.157.0 # {"$imagepolicy": "flux-system:victoria-metrics:tag"}
    digest: sha256:322a7a92fdcc269280e9c38af94c83bc76827a31b792acbc60e44394e7f29c20 # {"$imagepolicy": "flux-system:victoria-metrics:digest"}
labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring
      app.kubernetes.io/version: v1.157.0 # {"$imagepolicy": "flux-system:victoria-metrics:tag"}
