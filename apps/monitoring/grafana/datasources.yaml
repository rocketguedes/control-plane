apiVersion: 1
datasources:
  - name: prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://victoria-metrics-single-server:8428
    basicAuth: false
    isDefault: true
    jsonData:
      httpMethod: POST
    editable: false
  - name: VictoriaLogs
    uid: victorialogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://victoria-logs.monitoring.svc.cluster.local:9428
    basicAuth: false
    jsonData:
      multitenancyHeaders:
        AccountID: "0"
        ProjectID: "0"
    editable: false
