apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - configmap.yaml
  - deployment.yaml
  - httproute.yaml
  - persistentvolumeclaim.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: dashboards
    files:
      - dashboards/10229_rev57.json
      - dashboards/14205_rev1.json
      - dashboards/blocky-grafana.json
      - dashboards/gatus.json
      - dashboards/hytale-community.json
      - dashboards/ntfy-grafana.json
    options:
      labels:
        kustomize.toolkit.fluxcd.io/substitute: disabled
  - name: provisioning-alerting
    files:
      - contact-points.yaml
  - name: provisioning-dashboards
    files:
      - dashboards.yaml
  - name: provisioning-datasources
    files:
      - datasources.yaml
images:
  - name: docker.io/grafana/grafana
    newTag: 13.3.2-slim # {"$imagepolicy": "flux-system:grafana:tag"}
    digest: sha256:d8e504e5126ca243ffa6a38dc12c26d90c01f2b77ce05e3a7c99e28dcb6b2362 # {"$imagepolicy": "flux-system:grafana:digest"}
  - name: docker.io/library/busybox
    newTag: 1.37.0 # {"$imagepolicy": "flux-system:busybox:tag"}
    digest: sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec # {"$imagepolicy": "flux-system:busybox:digest"}
labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring
      app.kubernetes.io/version: 13.3.2-slim # {"$imagepolicy": "flux-system:grafana:tag"}
