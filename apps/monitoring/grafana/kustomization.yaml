apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - configmap.yaml
  - deployment.yaml
  - httproute.yaml
  - persistentvolumeclaim.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: dashboards
    files:
      - dashboards/10229_rev57.json
      - dashboards/14205_rev1.json
      - dashboards/ntfy-grafana.json
  - name: provisioning-alerting
    files:
      - contact-points.yaml
  - name: provisioning-dashboards
    files:
      - dashboards.yaml
  - name: provisioning-datasources
    files:
      - datasources.yaml
images:
  - name: docker.io/grafana/grafana
    newTag: 13.2.3-slim # {"$imagepolicy": "flux-system:grafana:tag"}
    digest: sha256:7c2b05e94eb43e2b88aa814d7a1c9421affc7f3593a951148177f29feaff6017 # {"$imagepolicy": "flux-system:grafana:digest"}
labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring
      app.kubernetes.io/version: 13.2.3-slim # {"$imagepolicy": "flux-system:grafana:tag"}
