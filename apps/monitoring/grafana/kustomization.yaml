apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - configmap.yaml
  - deployment.yaml
  - httproute.yaml
  - persistentvolumeclaim.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: dashboards
    files:
      - dashboards/10229_rev57.json
      - dashboards/14205_rev1.json
      - dashboards/blocky-grafana.json
      - dashboards/gatus.json
      - dashboards/hytale-community.json
      - dashboards/ntfy-grafana.json
  - name: provisioning-alerting
    files:
      - contact-points.yaml
  - name: provisioning-dashboards
    files:
      - dashboards.yaml
  - name: provisioning-datasources
    files:
      - datasources.yaml
images:
  - name: docker.io/grafana/grafana
    newTag: 13.3.1-slim # {"$imagepolicy": "flux-system:grafana:tag"}
    digest: sha256:49221b454a407632e47e6d4bbc2bb1585c462bf68c6fb9ebed4aa072b027595a # {"$imagepolicy": "flux-system:grafana:digest"}
labels:
  - pairs:
      app.kubernetes.io/part-of: monitoring
      app.kubernetes.io/version: 13.3.1-slim # {"$imagepolicy": "flux-system:grafana:tag"}
