apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-logs
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/instance: victoria-logs
    app.kubernetes.io/component: server
spec:
  replicas: 1
  serviceName: victoria-logs
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
      app.kubernetes.io/instance: victoria-logs
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
        app.kubernetes.io/instance: victoria-logs
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "9428"
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: victoria-logs
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: vlsingle
          image: docker.io/victoriametrics/victoria-logs
          args:
            - --envflag.enable
            - --envflag.prefix=VM_
            - --http.shutdownDelay=15s
            - --httpListenAddr=:9428
            - --loggerFormat=json
            - --retentionPeriod=1
            - --storageDataPath=/storage
          ports:
            - name: http
              protocol: TCP
              containerPort: 9428
          volumeMounts:
            - name: server-volume
              mountPath: /storage
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: server-volume
        labels:
          app.kubernetes.io/name: victoria-logs
          app.kubernetes.io/instance: victoria-logs
          app.kubernetes.io/component: server
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
