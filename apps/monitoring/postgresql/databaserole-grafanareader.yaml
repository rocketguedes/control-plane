apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: grafanareader
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
    app.kubernetes.io/component: database
spec:
  cluster:
    name: postgresql
  name: grafanareader
  login: true
  inRoles:
    - pg_read_all_data
  passwordSecret:
    name: grafanareader
  databaseRoleReclaimPolicy: retain
