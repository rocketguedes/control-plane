apiVersion: apps/v1
kind: Deployment
metadata:
  name: push
  labels:
    app.kubernetes.io/name: push
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: push
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: push
      app.kubernetes.io/instance: fluxer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: push
        app.kubernetes.io/instance: fluxer
        app.kubernetes.io/component: push
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-dependencies
          image: docker.io/library/busybox
          command:
            - sh
            - -c
            - for t in nats:4222; do until nc -z -w 2 ${t%:*} ${t##*:}; do echo waiting for $t; sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: push
          image: ghcr.io/fluxerapp/fluxer-push
          envFrom:
            - configMapRef:
                name: fluxer-push
            - secretRef:
                name: fluxer-push
          ports:
            - name: http
              containerPort: 8126
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              command:
                - /usr/local/bin/fluxer-push
                - healthcheck
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - /usr/local/bin/fluxer-push
                - healthcheck
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /usr/local/bin/fluxer-push
                - healthcheck
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
