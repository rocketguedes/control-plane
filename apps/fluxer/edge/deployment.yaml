apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: edge
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
      app.kubernetes.io/instance: fluxer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edge
        app.kubernetes.io/instance: fluxer
        app.kubernetes.io/component: edge
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: edge
          image: docker.io/library/caddy
          envFrom:
            - configMapRef:
                name: edge-caddy
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy
              readOnly: true
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          startupProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:2019/config/
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:2019/config/
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - -O
                - /dev/null
                - http://127.0.0.1:2019/config/
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: caddyfile
          configMap:
            name: edge-caddyfile
        - name: config
          emptyDir: {}
        - name: data
          emptyDir: {}
