apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: fluxer
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
