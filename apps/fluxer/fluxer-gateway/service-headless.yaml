apiVersion: v1
kind: Service
metadata:
  name: gateway-headless
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: gateway
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/instance: fluxer
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
    - name: epmd
      protocol: TCP
      port: 4369
      targetPort: epmd
    - name: erl-dist
      protocol: TCP
      port: 8081
      targetPort: erl-dist
