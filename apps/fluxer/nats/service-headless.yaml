apiVersion: v1
kind: Service
metadata:
  name: nats-headless
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: messaging
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: fluxer
  ports:
    - name: client
      protocol: TCP
      port: 4222
      targetPort: client
    - name: cluster
      protocol: TCP
      port: 6222
      targetPort: cluster
