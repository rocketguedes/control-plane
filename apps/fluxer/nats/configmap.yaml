apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: messaging
data:
  nats.conf: |-
    server_name: $POD_NAME
    listen: 0.0.0.0:4222
    http: 127.0.0.1:8222
    authorization {
      token: "__FLUXER_NATS_AUTH_TOKEN__"
    }
    jetstream {
      store_dir: /data
    }
