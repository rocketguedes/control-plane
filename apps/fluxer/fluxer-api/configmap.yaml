apiVersion: v1
kind: ConfigMap
metadata:
  name: fluxer-api
  labels:
    app.kubernetes.io/name: fluxer-api
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: api
data:
  FLUXER_ACCOUNT_IDENTITY: email
  FLUXER_ADMIN_ENDPOINT: https://chat.guedescloud.com.br/admin
  FLUXER_API_PORT: "8080"
  FLUXER_API_PRESIGNED_ATTACHMENT_UPLOADS_ENABLED: "true"
  FLUXER_API_PRESIGNED_HARVEST_DOWNLOADS_ENABLED: "false"
  FLUXER_APP_ENDPOINT: https://chat.guedescloud.com.br
  FLUXER_APP_PRODUCT_NAME: Guedes Cloud
  FLUXER_BASE_DOMAIN: chat.guedescloud.com.br
  FLUXER_BLOCKLIST_FEEDS_ENABLED: "true"
  FLUXER_BREACHED_PASSWORD_CHECK_ENABLED: "true"
  FLUXER_DATABASE_BACKEND: postgres
  FLUXER_DISCOVERY_ENABLED: "false"
  FLUXER_EMAIL_FROM_EMAIL: noreply@localhost
  FLUXER_INTERNAL_MEDIA_PROXY_ENDPOINT: http://media-proxy:8080
  FLUXER_LIVEKIT_DEFAULT_REGION: "{\"id\":\"default\",\"name\":\"Default\",\"emoji\":\"\U0001F30D\",\"latitude\":0,\"longitude\":0}"
  FLUXER_LIVEKIT_ENABLED: "true"
  FLUXER_LIVEKIT_INTERNAL_URL: http://livekit-server.livekit.svc.cluster.local:80
  FLUXER_LIVEKIT_URL: wss://livekit.guedescloud.com.br
  FLUXER_MEDIA_ENDPOINT: https://chat.guedescloud.com.br/media
  FLUXER_NATS_JETSTREAM_URL: nats://nats:4222
  FLUXER_NATS_URL: nats://nats:4222
  FLUXER_PASSKEY_ADDITIONAL_ALLOWED_ORIGINS: https://chat.guedescloud.com.br
  FLUXER_PASSKEY_RP_ID: chat.guedescloud.com.br
  FLUXER_POSTGRES_DATABASE: fluxer
  FLUXER_POSTGRES_HOST: postgresql-rw.postgresql.svc.cluster.local
  FLUXER_POSTGRES_MAX_CONNECTIONS: "25"
  FLUXER_POSTGRES_PORT: "5432"
  FLUXER_POSTGRES_SSL: "false"
  FLUXER_POSTGRES_USERNAME: fluxer
  FLUXER_PUBLIC_PORT: "443"
  FLUXER_PUBLIC_SCHEME: https
  FLUXER_S3_BUCKET_CDN: fluxer
  FLUXER_S3_BUCKET_HARVESTS: fluxer-harvests
  FLUXER_S3_BUCKET_REPORTS: fluxer-reports
  FLUXER_S3_BUCKET_UPLOADS: fluxer-uploads
  FLUXER_S3_ENDPOINT: http://seaweedfs:8333
  FLUXER_S3_FORCE_PATH_STYLE: "true"
  FLUXER_S3_PUBLIC_ENDPOINT: http://seaweedfs:8333
  FLUXER_S3_REGION: us-east-1
  FLUXER_SEARCH_ENGINE: meilisearch
  FLUXER_SEARCH_URL: http://meilisearch:7700
  FLUXER_SELF_HOSTED: "true"
  FLUXER_TRUST_CLIENT_IP_HEADER: "true"
  FLUXER_VAPID_EMAIL: admin@chat.guedescloud.com.br
  FLUXER_VOICE_P2P_STUN_URLS: "stun:global.stun.twilio.com:3478,stun:stun.l.google.com:19302"
  NODE_ENV: production
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
  NODE_OPTIONS: --enable-source-maps
