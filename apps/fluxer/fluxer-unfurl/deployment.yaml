apiVersion: apps/v1
kind: Deployment
metadata:
  name: unfurl
  labels:
    app.kubernetes.io/name: unfurl
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: svc
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: unfurl
      app.kubernetes.io/instance: fluxer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unfurl
        app.kubernetes.io/instance: fluxer
        app.kubernetes.io/component: svc
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 35
      initContainers:
        - name: wait-for-dependencies
          image: docker.io/library/busybox
          command:
            - sh
            - -c
            - for t in nats:4222; do until nc -z -w 2 ${t%:*} ${t##*:}; do echo waiting for $t; sleep 2; done; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: router
          image: ghcr.io/fluxerapp/fluxer-unfurl
          envFrom:
            - configMapRef:
                name: fluxer-unfurl
            - secretRef:
                name: fluxer-unfurl
          env:
            - name: FLUXER_SVC_MODE
              value: router
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: {}
