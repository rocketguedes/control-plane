apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: fluxer
  serviceName: seaweedfs
  podManagementPolicy: Parallel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/instance: fluxer
        app.kubernetes.io/component: storage
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: docker.io/chrislusf/seaweedfs
          args:
            - server
            - -s3
            - -dir=/data
            - -master.telemetry=false
            - -master.volumeSizeLimitMB=1024
            - -master.garbageThreshold=0.1
            - -volume.max=10000
            - -ip=127.0.0.1
            - -ip.bind=127.0.0.1
            - -s3.ip.bind=0.0.0.0
          envFrom:
            - configMapRef:
                name: seaweedfs
          ports:
            - name: s3
              containerPort: 8333
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
        - name: seaweedfs-init
          image: docker.io/chrislusf/seaweedfs
          command:
            - /bin/sh
            - -c
            - |
              trap 'exit 0' TERM INT
              buckets="$FLUXER_S3_BUCKET_CDN $FLUXER_S3_BUCKET_UPLOADS $FLUXER_S3_BUCKET_REPORTS $FLUXER_S3_BUCKET_HARVESTS"
              missing="$buckets"
              for _attempt in $(seq 1 "$FLUXER_SEAWEEDFS_INIT_ATTEMPTS"); do
                if ! nc -z 127.0.0.1 9333 2>/dev/null; then
                  sleep 2
                  continue
                fi
                listed=$(echo "s3.bucket.list" | timeout 10 weed shell -master=127.0.0.1:9333 2>&1)
                missing=""
                failure=""
                for b in $buckets; do
                  echo "$listed" | grep -q "^[[:space:]]*${b}[[:space:]]" || missing="${missing:+$missing }$b"
                done
                if [ -z "$missing" ]; then
                  if [ "$FLUXER_SEAWEEDFS_UPLOADS_TTL" = off ]; then
                    ttl_rule="fs.configure -locationPrefix=/buckets/$FLUXER_S3_BUCKET_UPLOADS/ -delete -apply"
                  else
                    ttl_rule="fs.configure -locationPrefix=/buckets/$FLUXER_S3_BUCKET_UPLOADS/ -ttl=$FLUXER_SEAWEEDFS_UPLOADS_TTL -apply"
                  fi
                  failure="could not configure the S3 identity"
                  if echo "s3.configure -user=fluxer -access_key=$FLUXER_S3_ACCESS_KEY -secret_key=$FLUXER_S3_SECRET_KEY -actions=Admin,Read,Write,List,Tagging -apply" | timeout 10 weed shell -master=127.0.0.1:9333 >/dev/null 2>&1; then
                    failure="could not set the expiry of $FLUXER_S3_BUCKET_UPLOADS"
                    if echo "$ttl_rule" | timeout 10 weed shell -master=127.0.0.1:9333 >/dev/null 2>&1; then
                      echo "buckets ready"
                      touch /tmp/fluxer-buckets-ready
                      while :; do
                        sleep 86400 &
                        wait $!
                      done
                    fi
                  fi
                  sleep 2
                  continue
                fi
                for b in $missing; do
                  echo "s3.bucket.create -name $b" | timeout 10 weed shell -master=127.0.0.1:9333 >/dev/null 2>&1
                done
                sleep 2
              done
              if [ -n "$failure" ]; then
                echo "seaweedfs-init $failure" >&2
              else
                echo "seaweedfs-init could not verify buckets: $missing" >&2
              fi
              exit 1
          envFrom:
            - configMapRef:
                name: seaweedfs
          env:
            - name: FLUXER_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs
                  key: FLUXER_S3_ACCESS_KEY_ID
            - name: FLUXER_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs
                  key: FLUXER_S3_SECRET_ACCESS_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /tmp/fluxer-buckets-ready
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
