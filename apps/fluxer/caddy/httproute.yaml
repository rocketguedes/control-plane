apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: caddy
  labels:
    app.kubernetes.io/name: caddy
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: edge
spec:
  parentRefs:
    - name: cilium-gateway-system
      namespace: kube-system
      port: 443
  hostnames:
    - chat.guedescloud.com.br
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: caddy
          port: 8080
      timeouts:
        request: 0s
