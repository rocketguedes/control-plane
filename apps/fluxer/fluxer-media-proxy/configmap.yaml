apiVersion: v1
kind: ConfigMap
metadata:
  name: fluxer-media-proxy
  labels:
    app.kubernetes.io/name: fluxer-media-proxy
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: media-proxy
data:
  FLUXER_MEDIA_PROXY_CORS_ALLOWED_ORIGINS: https://chat.guedescloud.com.br:443
  FLUXER_MEDIA_PROXY_MODE: upload
  FLUXER_MEDIA_PROXY_PORT: '8080'
  FLUXER_MEDIA_PROXY_PUBLIC_ENDPOINT: https://chat.guedescloud.com.br/media
  FLUXER_MEDIA_PROXY_STORAGE_BACKEND: s3
  FLUXER_S3_BUCKET_CDN: fluxer
  FLUXER_S3_BUCKET_UPLOADS: fluxer-uploads
  FLUXER_S3_ENDPOINT: http://seaweedfs:8333
  FLUXER_S3_FORCE_PATH_STYLE: 'true'
  FLUXER_S3_READ_SIGNED: 'true'
  FLUXER_S3_REGION: us-east-1
