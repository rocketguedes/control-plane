apiVersion: v1
kind: Service
metadata:
  name: app-proxy
  labels:
    app.kubernetes.io/name: app-proxy
    app.kubernetes.io/instance: fluxer
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: app-proxy
    app.kubernetes.io/instance: fluxer
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
