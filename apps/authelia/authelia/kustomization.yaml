apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: authelia
resources:
  - deployment.yaml
  - httproute.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: authelia-config
    files:
      - configuration.yml
# IMPORTANT: Flux ImagePolicy setter markers are intentionally omitted.
# Authelia is the central IdP and upstream recommends manually reviewing
# release notes before upgrading, as minor/patch versions may introduce
# deprecations or breaking changes. Flux ImagePolicy triggers alerts only.
# Ref: https://www.authelia.com/policies/versioning/
images:
  - name: ghcr.io/authelia/authelia
    newTag: 4.39.28
    digest: sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54
labels:
  - pairs:
      app.kubernetes.io/part-of: authelia
      app.kubernetes.io/version: 4.39.28
