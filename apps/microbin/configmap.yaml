apiVersion: v1
kind: ConfigMap
metadata:
  name: microbin
  labels:
    app.kubernetes.io/name: microbin
    app.kubernetes.io/instance: microbin
data:
  MICROBIN_BIND: "::"
  MICROBIN_DATA_DIR: microbin_data
  MICROBIN_DEFAULT_BURN_AFTER: "0"
  MICROBIN_DEFAULT_EXPIRY: 24hour
  MICROBIN_DEFAULT_PRIVACY: unlisted
  MICROBIN_DISABLE_TELEMETRY: "true"
  MICROBIN_DISABLE_UPDATE_CHECKING: "false"
  MICROBIN_EDITABLE: "false"
  MICROBIN_ENABLE_BURN_AFTER: "true"
  MICROBIN_ENABLE_READONLY: "true"
  MICROBIN_ENCRYPTION_CLIENT_SIDE: "true"
  MICROBIN_ENCRYPTION_SERVER_SIDE: "true"
  MICROBIN_ETERNAL_PASTA: "false"
  MICROBIN_GC_DAYS: "90"
  MICROBIN_HASH_IDS: "true"
  MICROBIN_HIDE_FOOTER: "true"
  MICROBIN_HIDE_HEADER: "false"
  MICROBIN_HIDE_LOGO: "false"
  MICROBIN_HIGHLIGHTSYNTAX: "true"
  MICROBIN_JSON_DB: "false"
  MICROBIN_LIST_SERVER: "false"
  MICROBIN_MAX_EXPIRY: 1week
  MICROBIN_MAX_FILE_SIZE_ENCRYPTED_MB: "16"
  MICROBIN_MAX_FILE_SIZE_UNENCRYPTED_MB: "32"
  MICROBIN_NO_FILE_UPLOAD: "true"
  MICROBIN_NO_LISTING: "true"
  MICROBIN_PORT: "8080"
  MICROBIN_PRIVATE: "true"
  MICROBIN_PUBLIC_PATH: https://paste.guedescloud.com.br/
  MICROBIN_QR: "true"
  MICROBIN_READONLY: "false"
  MICROBIN_SHOW_READ_STATS: "true"
  MICROBIN_THREADS: "1"
  MICROBIN_WIDE: "false"
