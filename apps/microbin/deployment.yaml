apiVersion: apps/v1
kind: Deployment
metadata:
  name: microbin
  labels:
    app.kubernetes.io/name: microbin
    app.kubernetes.io/instance: microbin
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: microbin
      app.kubernetes.io/instance: microbin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: microbin
        app.kubernetes.io/instance: microbin
    spec:
      serviceAccountName: microbin
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: microbin
          image: docker.io/danielszabo99/microbin
          envFrom:
            - configMapRef:
                name: microbin
            - secretRef:
                name: microbin
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: microbin
              mountPath: /app/microbin_data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: microbin
          persistentVolumeClaim:
            claimName: microbin
        - name: tmp
          emptyDir: {}
