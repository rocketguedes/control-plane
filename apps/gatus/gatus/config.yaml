storage:
  type: postgres
  path: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql-rw.postgresql.svc.cluster.local:5432/${POSTGRES_DB}?sslmode=disable"
  maximum-number-of-results: 720
  caching: true

metrics: true

ui:
  title: "Health Dashboard"
  custom-css: |
    header, footer, #social {
      display: none !important;
    }

alerting:
  ntfy:
    url: "http://ntfy-svc.ntfy.svc.cluster.local:8093"
    topic: "status-alerts"
    token: "${NTFY_TOKEN}"
    default-alert:
      failure-threshold: 3
      send-on-resolved: true

  custom:
    url: "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
    method: "POST"
    headers:
      Content-Type: "application/json"
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: '🚨 *Servidor Hytale inacessível!*\n@CristianoFurtado @Luc4sM0ur4 @IarleMozaga @nwildner @leanguedes\nO servidor não está respondendo às checagens externas.\n\n*Motivo:* '
        RESOLVED: '✅ *Comunicação com o servidor Hytale restabelecida!*\nO serviço voltou a responder e as métricas foram normalizadas.'
    body: |
      {
        "chat_id": "${HYTALE_COMMUNITY_TELEGRAM_CHAT_ID}",
        "text": "[ALERT_TRIGGERED_OR_RESOLVED][RESULT_ERRORS]",
        "parse_mode": "MARKDOWN"
      }
    default-alert:
      failure-threshold: 3
      success-threshold: 3
      send-on-resolved: true

endpoints:
  - name: headscale
    group: core
    url: "https://headscale.headscale.svc.cluster.local:8080/health"
    interval: 30s
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == pass"
    alerts:
      - type: ntfy

  - name: authelia
    group: core
    url: "http://authelia.authelia.svc.cluster.local/api/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: vaultwarden
    group: core
    url: "http://vaultwarden.vaultwarden.svc.cluster.local:8080/alive"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: livekit
    group: core
    url: "http://livekit.livekit.svc.cluster.local/"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    alerts:
      - type: ntfy

  - name: fluxer-api
    group: apps
    url: "http://api.fluxer.svc.cluster.local:8080/_health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    alerts:
      - type: ntfy

  - name: navidrome
    group: apps
    url: "http://navidrome.navidrome.svc.cluster.local:4533/ping"
    interval: 1m
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: hytale-community
    group: games
    url: "https://gamesnolinux.com.br:5523/ApexHosting/PrometheusExporter/metrics"
    interval: 10s
    client:
      insecure: true
    headers:
      Authorization: "${HYTALE_COMMUNITY_AUTH_HEADER}"
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*hytale_players_online*)"
    alerts:
      - type: ntfy
      - type: custom
