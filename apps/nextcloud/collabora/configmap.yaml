apiVersion: v1
kind: ConfigMap
metadata:
  name: collabora
  labels:
    app.kubernetes.io/name: collabora
    app.kubernetes.io/instance: collabora
    app.kubernetes.io/component: collabora
data:
  DONT_GEN_SSL_CERT: "1"
  aliasgroup1: https://drive.guedescloud.com.br:443
  extra_params: --o:ssl.enable=false --o:ssl.termination=true --o:welcome.enable=false --o:fetch_update_check=0 --o:allow_update_popup=false
  server_name: office.guedescloud.com.br
