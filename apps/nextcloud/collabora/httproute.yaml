apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: collabora
  labels:
    app.kubernetes.io/name: collabora
    app.kubernetes.io/instance: collabora
    app.kubernetes.io/component: collabora
spec:
  parentRefs:
    - name: cilium-gateway-system
      namespace: kube-system
      port: 443
  hostnames:
    - office.guedescloud.com.br
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: collabora
          port: 9980

