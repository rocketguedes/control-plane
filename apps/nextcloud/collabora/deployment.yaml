apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
  labels:
    app.kubernetes.io/name: collabora
    app.kubernetes.io/instance: collabora
    app.kubernetes.io/component: collabora
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: collabora
      app.kubernetes.io/instance: collabora
      app.kubernetes.io/component: collabora
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collabora
        app.kubernetes.io/instance: collabora
        app.kubernetes.io/component: collabora
    spec:
      serviceAccountName: collabora
      automountServiceAccountToken: false
      enableServiceLinks: false
      containers:
        - name: collabora
          image: docker.io/collabora/code
          envFrom:
            - configMapRef:
                name: collabora
            - secretRef:
                name: collabora
          ports:
            - name: http
              containerPort: 9980
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            capabilities:
              add:
                - MKNOD
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 2
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    type: Recreate
