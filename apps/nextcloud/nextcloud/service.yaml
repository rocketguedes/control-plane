apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/component: nextcloud
spec:
  ipFamilyPolicy: PreferDualStack
  selector:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/component: nextcloud
  ports:
    - name: http
      appProtocol: http
      protocol: TCP
      port: 80
      targetPort: http
