apiVersion: v1
kind: ConfigMap
metadata:
  name: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/component: nextcloud
data:
  APACHE_BODY_LIMIT: "0"
  APACHE_DISABLE_REWRITE_IP: "1"
  DEFAULT_PHONE_REGION: BR
  NEXTCLOUD_ADMIN_USER: admin
  NEXTCLOUD_INIT_HTACCESS: "true"
  NEXTCLOUD_TRUSTED_DOMAINS: drive.guedescloud.com.br localhost 127.0.0.1
  OVERWRITECLIURL: https://drive.guedescloud.com.br
  OVERWRITEHOST: drive.guedescloud.com.br
  OVERWRITEPROTOCOL: https
  PHP_MEMORY_LIMIT: 1024M
  PHP_UPLOAD_LIMIT: 10G
  POSTGRES_DB: nextcloud
  POSTGRES_HOST: postgresql-rw.postgresql.svc.cluster.local
  POSTGRES_USER: nextcloud
  REDIS_HOST: valkey
  REDIS_HOST_PORT: "6379"
  TRUSTED_PROXIES: 10.42.0.0/16 10.43.0.0/16 fd42::/56 fd43::/112 127.0.0.1 ::1
