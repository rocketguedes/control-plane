apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/instance: nextcloud
    app.kubernetes.io/component: nextcloud
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
      app.kubernetes.io/instance: nextcloud
      app.kubernetes.io/component: nextcloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud
        app.kubernetes.io/instance: nextcloud
        app.kubernetes.io/component: nextcloud
    spec:
      serviceAccountName: nextcloud
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-dependencies
          image: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
          command:
            - sh
            - -c
            - until pg_isready -h ${POSTGRES_HOST} -U ${POSTGRES_USER} ; do sleep 2 ; done
          envFrom:
            - configMapRef:
                name: nextcloud
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: nextcloud
          image: docker.io/library/nextcloud
          envFrom:
            - configMapRef:
                name: nextcloud
            - secretRef:
                name: nextcloud
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nextcloud
              mountPath: /var/www/html
              subPath: html
            - name: nextcloud
              mountPath: /var/www/html/data
              subPath: data
            - name: nextcloud
              mountPath: /var/www/html/config
              subPath: config
            - name: nextcloud
              mountPath: /var/www/html/custom_apps
              subPath: custom_apps
            - name: nextcloud
              mountPath: /var/www/html/themes
              subPath: themes
            - name: hooks
              mountPath: /docker-entrypoint-hooks.d/before-starting
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 40m
              memory: 320Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /status.php
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
        - name: nextcloud-cron
          image: docker.io/library/nextcloud
          command:
            - /cron.sh
          envFrom:
            - configMapRef:
                name: nextcloud
            - secretRef:
                name: nextcloud
          volumeMounts:
            - name: nextcloud
              mountPath: /var/www/html
              subPath: html
            - name: nextcloud
              mountPath: /var/www/html/data
              subPath: data
            - name: nextcloud
              mountPath: /var/www/html/config
              subPath: config
            - name: nextcloud
              mountPath: /var/www/html/custom_apps
              subPath: custom_apps
            - name: nextcloud
              mountPath: /var/www/html/themes
              subPath: themes
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: nextcloud
          persistentVolumeClaim:
            claimName: nextcloud
        - name: hooks
          configMap:
            defaultMode: 493
            name: nextcloud-hooks
        - name: tmp
          emptyDir: {}
  strategy:
    type: Recreate
