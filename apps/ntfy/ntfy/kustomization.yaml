apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ntfy
resources:
  - configmap.yaml
  - deployment.yaml
  - httproute.yaml
  - persistentvolumeclaim.yaml
  - secret.yaml
  - service.yaml
  - serviceaccount.yaml
configMapGenerator:
  - name: templates
    files:
      - templates/flux.yml
images:
  - name: docker.io/binwiederhier/ntfy
    newTag: v2.32.0 # {"$imagepolicy": "flux-system:ntfy:tag"}
    digest: sha256:59250e1d8be2ee2186c4560322f625faef22ace380331f05b63f8842dbd62602 # {"$imagepolicy": "flux-system:ntfy:digest"}
labels:
  - pairs:
      app.kubernetes.io/part-of: ntfy
      app.kubernetes.io/version: v2.32.0 # {"$imagepolicy": "flux-system:ntfy:tag"}
