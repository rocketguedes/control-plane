# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

includes:
  common:
    taskfile: ./taskfiles/common.yml
    internal: true
  k3s:
    taskfile: ./taskfiles/k3s.yml
  cilium:
    taskfile: ./taskfiles/cilium.yml
  flux:
    taskfile: ./taskfiles/flux.yml

set: [pipefail]

vars:
  SSH_HOST: '{{.SSH_HOST | default "control-plane"}}'
  K3S_API_PORT: '{{.K3S_API_PORT | default "6443"}}'
  GITHUB_OWNER: '{{.GITHUB_OWNER | default "rocketguedes"}}'
  GITHUB_REPO: '{{.GITHUB_REPO | default "control-plane"}}'
  GITHUB_BRANCH: '{{.GITHUB_BRANCH | default "master"}}'
  CLUSTER_PATH: '{{.CLUSTER_PATH | default "clusters/sa-saopaulo-1"}}'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - "{{.TASK_EXE}} --list"

  bootstrap:
    desc: Run full cluster bootstrap (k3s, cilium, flux)
    summary: |
      Provisions the single-node K3s cluster, installs Gateway API CRDs and Cilium,
      creates the SOPS age secret, and bootstraps Flux CD.

      Every step is idempotent and can be re-run safely or invoked individually.
      Common overrides:
        SSH_HOST=control-plane
        INSTALL_K3S_VERSION=v1.37.2+k3s1
        GITHUB_TOKEN=<pat>
    cmds:
      - task: k3s:sysctl
      - task: k3s:config
      - task: k3s:install
      - task: k3s:start
      - task: k3s:kubeconfig
      - task: cilium:gateway-api
      - task: cilium:install
      - task: flux:secret
      - task: flux:bootstrap
