---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: fluxer-info
  namespace: flux-system
spec:
  providerRef:
    name: fluxer
  eventSeverity: info
  eventSources:
    - kind: ImageUpdateAutomation
      name: flux-system
    - kind: ImagePolicy
      name: "*"
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: OCIRepository
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: kube-system
    - kind: OCIRepository
      name: "*"
      namespace: kube-system
    - kind: HelmRelease
      name: "*"
      namespace: reloader
    - kind: OCIRepository
      name: "*"
      namespace: reloader
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: fluxer-error
  namespace: flux-system
spec:
  providerRef:
    name: fluxer
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: Kustomization
      name: "*"
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: ntfy-info
  namespace: flux-system
spec:
  providerRef:
    name: ntfy
  eventSeverity: info
  eventSources:
    - kind: ImageUpdateAutomation
      name: flux-system
    - kind: ImagePolicy
      name: "*"
    - kind: HelmRelease
      name: "*"
      namespace: cert-manager
    - kind: OCIRepository
      name: "*"
      namespace: cert-manager
    - kind: HelmRelease
      name: "*"
      namespace: kube-system
    - kind: OCIRepository
      name: "*"
      namespace: kube-system
    - kind: HelmRelease
      name: "*"
      namespace: reloader
    - kind: OCIRepository
      name: "*"
      namespace: reloader
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: ntfy-error
  namespace: flux-system
spec:
  providerRef:
    name: ntfy
  eventSeverity: error
  eventSources:
    - kind: GitRepository
      name: "*"
    - kind: Kustomization
      name: "*"
