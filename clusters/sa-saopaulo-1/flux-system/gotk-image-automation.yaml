---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        {{- $apps := dict -}}
        {{- range .Changed.Changes -}}
          {{- if or (hasSuffix ":tag" .Setter) (hasSuffix ":digest" .Setter) -}}
            {{- $appName := regexReplaceAll ".*:([^:]+):(tag|digest)" .Setter "$1" -}}
            {{- if not (hasKey $apps $appName) -}}
              {{- $_ := set $apps $appName "" -}}
            {{- end -}}
            {{- if hasSuffix ":tag" .Setter -}}
              {{- $_ := set $apps $appName .NewValue -}}
            {{- end -}}
          {{- end -}}
        {{- end -}}
        {{- if eq (len $apps) 1 -}}
          {{- range $app, $ver := $apps -}}
            {{- if eq $ver "" -}}
        chore({{ $app }}): update image digest
            {{- else -}}
        chore({{ $app }}): update version to {{ $ver }}
            {{- end -}}
          {{- end -}}
        {{- else -}}
        chore: update container images
        {{ range $app, $ver := $apps }}
        {{- if eq $ver "" }}
        * chore({{ $app }}): update image digest
        {{- else }}
        * chore({{ $app }}): update version to {{ $ver }}
        {{- end -}}
        {{ end -}}
        {{- end -}}
    push:
      branch: master
  update:
    path: .
    strategy: Setters
