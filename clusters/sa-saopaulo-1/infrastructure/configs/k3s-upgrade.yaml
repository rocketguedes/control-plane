---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k3s-upgrade
  namespace: flux-system
spec:
  dependsOn:
    - name: system-upgrade-controller
  interval: 5m0s
  path: ./infrastructure/configs/k3s-upgrade
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
  wait: true
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: k3s-upgrade
  namespace: flux-system
spec:
  image: docker.io/rancher/k3s-upgrade
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: k3s-upgrade
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: k3s-upgrade
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-k3s[0-9]+$'
    extract: "$version"
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: "1.36.x"
