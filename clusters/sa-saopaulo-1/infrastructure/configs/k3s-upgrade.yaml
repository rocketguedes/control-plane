---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k3s-upgrade
  namespace: flux-system
spec:
  dependsOn:
    - name: system-upgrade-controller
  interval: 5m0s
  path: ./infrastructure/configs/k3s-upgrade
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
  wait: true
