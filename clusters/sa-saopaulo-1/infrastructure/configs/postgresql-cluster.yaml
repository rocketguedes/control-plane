---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql-cluster
  namespace: flux-system
spec:
  dependsOn:
    - name: cloudnative-pg
    - name: namespaces
  interval: 5m0s
  path: ./infrastructure/configs/postgresql
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: postgresql
  namespace: flux-system
spec:
  image: ghcr.io/cloudnative-pg/postgresql
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: postgresql
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: postgresql
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+)-standard-trixie$'
    extract: "$version"
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: "18.x"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vchord-scratch
  namespace: flux-system
spec:
  image: ghcr.io/tensorchord/vchord-scratch
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vchord-scratch
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: vchord-scratch
  filterTags:
    pattern: '^pg18-v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: "$version"
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: "1.1.x"
