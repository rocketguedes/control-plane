---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: headscale
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: certificate-issuer
    - name: namespaces
  interval: 5m0s
  path: ./apps/headscale
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 15m0s
  wait: true
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: headscale
  namespace: flux-system
spec:
  image: docker.io/headscale/headscale
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: headscale
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: headscale
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: "0.x"
