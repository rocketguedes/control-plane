---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vector
  namespace: flux-system
spec:
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: namespaces
    - name: victoria-logs
  interval: 5m0s
  path: ./apps/vector
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
  wait: true
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: vector
  namespace: flux-system
spec:
  image: docker.io/timberio/vector
  interval: 1h
  secretRef:
    name: regcred
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: vector
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: vector
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-distroless-libc$'
    extract: "$version"
  digestReflectionPolicy: Always
  interval: 1h
  policy:
    semver:
      range: "0.x"
