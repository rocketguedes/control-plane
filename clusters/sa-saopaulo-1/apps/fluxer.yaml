---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: fluxer-admin
  namespace: flux-system
spec:
  image: ghcr.io/fluxerapp/fluxer-admin
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: fluxer-admin
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: fluxer-admin
  filterTags:
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: ">=2026.0.0"
---
