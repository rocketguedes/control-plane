---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: meilisearch
  namespace: flux-system
spec:
  image: docker.io/getmeili/meilisearch
  interval: 1h
  secretRef:
    name: regcred
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: meilisearch
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: meilisearch
  filterTags:
    pattern: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: "$version"
  digestReflectionPolicy: Always
  interval: 1h
  policy:
    semver:
      range: "1.53.x"
