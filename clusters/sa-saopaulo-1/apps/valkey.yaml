---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: valkey
  namespace: flux-system
spec:
  image: docker.io/valkey/valkey
  interval: 1h
  secretRef:
    name: regcred
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: valkey
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: valkey
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-alpine[0-9]+\.[0-9]+$'
    extract: "$version"
  digestReflectionPolicy: Always
  interval: 1h
  policy:
    semver:
      range: "9.x"
