---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud-postgresql
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: postgresql-cluster
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.applied) &&
        status.applied == true
      failed: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.applied) &&
        status.applied == false
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.applied) &&
        status.applied == true
      failed: >-
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.applied) &&
        status.applied == false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 5m0s
  timeout: 2m0s
  path: ./apps/nextcloud/postgresql
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true

