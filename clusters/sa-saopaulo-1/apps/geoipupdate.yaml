---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: geoipupdate
  namespace: flux-system
spec:
  image: ghcr.io/maxmind/geoipupdate
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: geoipupdate
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: geoipupdate
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: ">=8.0.0"
