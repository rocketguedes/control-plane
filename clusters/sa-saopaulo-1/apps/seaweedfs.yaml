---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: seaweedfs
  namespace: flux-system
spec:
  image: docker.io/chrislusf/seaweedfs
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: seaweedfs
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: seaweedfs
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+)$'
    extract: "$version"
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: "4.47.x"
