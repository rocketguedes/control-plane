---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud-collabora
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 5m0s
  timeout: 5m0s
  path: ./apps/nextcloud/collabora
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: nextcloud-collabora
  namespace: flux-system
spec:
  image: docker.io/collabora/code
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: nextcloud-collabora
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nextcloud-collabora
  filterTags:
    pattern: '^[0-9]+(\.[0-9]+)+$'
  digestReflectionPolicy: IfNotPresent
  policy:
    numerical:
      order: asc

