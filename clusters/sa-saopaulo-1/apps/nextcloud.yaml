---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: nextcloud-postgresql
    - name: nextcloud-valkey
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  interval: 5m0s
  timeout: 10m0s
  path: ./apps/nextcloud/nextcloud
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: true
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  image: docker.io/library/nextcloud
  interval: 1h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: nextcloud
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: nextcloud
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)-apache$'
    extract: "$version"
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: "35.x"
