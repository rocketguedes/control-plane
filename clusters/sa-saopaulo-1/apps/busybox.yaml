---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: busybox
  namespace: flux-system
spec:
  image: docker.io/library/busybox
  interval: 1h
  secretRef:
    name: regcred
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: busybox
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: busybox
  filterTags:
    pattern: '^(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: "$version"
  digestReflectionPolicy: Always
  interval: 1h
  policy:
    semver:
      range: "1.37.x"
