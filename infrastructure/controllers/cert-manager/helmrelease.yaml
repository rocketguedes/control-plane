apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  interval: 15m0s
  timeout: 5m0s
  chartRef:
    kind: OCIRepository
    name: cert-manager
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m0s
  upgrade:
    crds: CreateReplace
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m0s
  driftDetection:
    mode: enabled
  values:
    crds:
      enabled: true
      keep: true
    resources:
      requests:
        memory: 96Mi
      limits:
        memory: 256Mi
    cainjector:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 192Mi
    webhook:
      resources:
        requests:
          memory: 64Mi
        limits:
          memory: 192Mi
