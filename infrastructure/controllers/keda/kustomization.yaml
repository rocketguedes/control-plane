apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - keda-2.21.1.yaml
patches:
  - target:
      kind: Deployment
      name: keda-admission
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
  - target:
      kind: Deployment
      name: keda-metrics-apiserver
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 15m
            memory: 96Mi
          limits:
            memory: 256Mi
  - target:
      kind: Deployment
      name: keda-operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 15m
            memory: 128Mi
          limits:
            memory: 384Mi
