apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - cnpg-1.30.2.yaml
patches:
  - target:
      kind: Deployment
      name: cnpg-controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 20m
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/cpu
