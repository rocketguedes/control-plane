apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 15m0s
  timeout: 5m0s
  chartRef:
    kind: OCIRepository
    name: cilium
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m0s
  upgrade:
    crds: CreateReplace
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m0s
  driftDetection:
    mode: enabled
  values:
    bpf:
      lbExternalClusterIP: true
      masquerade: true
    envoy:
      log:
        accessLogBufferSize: 32768
      resources:
        requests:
          memory: 96Mi
        limits:
          memory: 384Mi
      securityContext:
        capabilities:
          keepCapNetBindService: true
    gatewayAPI:
      enabled: true
      hostNetwork:
        enabled: true
    hubble:
      ui:
        enabled: true
        backend:
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 192Mi
        frontend:
          resources:
            requests:
              memory: 32Mi
            limits:
              memory: 64Mi
      relay:
        enabled: true
        resources:
          requests:
            memory: 64Mi
          limits:
            memory: 192Mi
    ipam:
      mode: kubernetes
    ipv6:
      enabled: true
    ipv6NativeRoutingCIDR: fd42::/56
    k8sServiceHost: 10.0.0.26
    k8sServicePort: 6443
    kubeProxyReplacement: true
    MTU: 1450
    operator:
      replicas: 1
      resources:
        requests:
          memory: 128Mi
        limits:
          memory: 384Mi
    resources:
      requests:
        memory: 384Mi
      limits:
        memory: 1536Mi
