apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 15m0s
  timeout: 5m0s
  chartRef:
    kind: OCIRepository
    name: cilium
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m0s
  upgrade:
    crds: CreateReplace
    serverSideApply: enabled
    strategy:
      name: RetryOnFailure
      retryInterval: 5m0s
  driftDetection:
    mode: enabled
  values:
    # NOTE: Disable auto-adjust for endpoint-create to avoid 429 rate-limit
    # storms on cold boot. Until a release includes upstream commit 3cff4dd9b6,
    # the initial bpf_lxc template compilation skews the limiter's moving mean
    # and throttles endpoint creation down to ~0.1/s. Remove once upgraded to a
    # Cilium release containing that fix.
    # Ref: https://github.com/cilium/cilium/commit/3cff4dd9b66b4f238bc2e40af1f7d360e2249f1e
    apiRateLimit: "endpoint-create=auto-adjust:false"
    bpf:
      lbExternalClusterIP: true
      masquerade: true
    envoy:
      log:
        accessLogBufferSize: 32768
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          memory: 384Mi
      securityContext:
        capabilities:
          envoy:
            - NET_ADMIN
            - SYS_ADMIN
            - NET_BIND_SERVICE
          keepCapNetBindService: true
    gatewayAPI:
      enabled: true
      hostNetwork:
        enabled: true
    hubble:
      ui:
        enabled: true
        backend:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 192Mi
        frontend:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      relay:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 192Mi
    ipam:
      mode: kubernetes
    ipv6:
      enabled: true
    ipv6NativeRoutingCIDR: fd42::/56
    k8sServiceHost: 10.0.0.26
    k8sServicePort: 6443
    kubeProxyReplacement: true
    MTU: 1450
    operator:
      replicas: 1
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 384Mi
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1536Mi
