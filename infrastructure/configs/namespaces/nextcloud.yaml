apiVersion: v1
kind: Namespace
metadata:
  name: nextcloud
  # RATIONALE: Namespace requires 'enforce: privileged' due to Collabora Online and Nextcloud Apache.
  # CONSTRAINT: Collabora Online (CODE) requires Linux capability 'MKNOD' and namespace sandboxing.
  #   Nextcloud Apache official container executes as root on entrypoint to configure permissions before dropping privileges.
  #   Kubernetes Pod Security Standards (Restricted) rejects root and non-default capabilities.
  # REFERENCE: https://github.com/kubernetes/website/blob/main/content/en/docs/concepts/security/pod-security-standards.md?plain=1#L153-L168
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted

