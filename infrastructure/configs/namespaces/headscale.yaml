apiVersion: v1
kind: Namespace
metadata:
  name: headscale
  # NOTE: Requires 'enforce: privileged' because Headscale exposes UDP 3478 via
  # hostPort for STUN NAT traversal. Pod Security Standards (Baseline) disallow
  # non-zero hostPorts and Pod Security Admission does not support allowlists.
  # Ref: https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
