apiVersion: v1
kind: Namespace
metadata:
  name: livekit
  # NOTE: Requires 'enforce: privileged' because LiveKit exposes 7881/TCP and
  # 7882/UDP via hostPort for direct WebRTC ICE media. Pod Security Standards
  # (Baseline) disallow non-zero hostPorts and Pod Security Admission does not
  # support allowlists.
  # Ref: https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
