apiVersion: v1
kind: Namespace
metadata:
  name: vector
  # NOTE: Requires 'enforce: privileged' because Vector mounts hostPath volumes
  # (/var/log and /var/lib/vector) and reads root-owned pod logs. Pod Security
  # Standards (Baseline) disallow hostPath volumes.
  # Ref: https://kubernetes.io/docs/concepts/security/pod-security-standards/#baseline
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
