apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: postgresql
spec:
  inheritedMetadata:
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "9187"
      prometheus.io/scrape: "true"
  instances: 1
  # NOTE: Skip the smart shutdown phase and issue a fast shutdown (preceded by
  # CHECKPOINT) immediately on pod termination. Long-lived client connection
  # pools keep smart shutdown waiting the full 180s default; existing clusters
  # retain the persisted 180s value even after CNPG 1.31 defaults to 0.
  # Ref: https://github.com/cloudnative-pg/cloudnative-pg/commit/78a018f45c7df68852ca4fe879cc68924c867fd6
  smartShutdownTimeout: 0
  storage:
    size: 10Gi
  imageName: ghcr.io/cloudnative-pg/postgresql
  postgresql:
    parameters:
      ssl_groups: X25519MLKEM768:X25519:prime256v1
    shared_preload_libraries:
      - vchord.so
    extensions:
      - name: vchord
        image:
          reference: ghcr.io/tensorchord/vchord-scratch
        dynamic_library_path:
          - /usr/lib/postgresql/18/lib
        extension_control_path:
          - /usr/share/postgresql/18/
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 150m
      memory: 768Mi
