apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-gateway-system
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    # RATIONALE: Discrete HTTPS listeners on port 443 are used instead of a single wildcard (*.guedescloud.com.br).
    # CONSTRAINT: End-to-end encryption for Headscale requires 'protocol: TLS' with 'mode: Passthrough' on port 443
    #   (TLS terminated directly by the Headscale pod). In Cilium Gateway API, mixing a wildcard HTTPS listener
    #   with a specific TLS passthrough listener on the same port causes a fatal ProtocolConflict because
    #   SNIHostnamesIntersect evaluates to true. Disjoint hostnames are strictly required on port 443.
    # REFERENCE: https://github.com/cilium/cilium/blob/main/operator/pkg/gateway-api/status_listener.go#L245-L254
    #   > // HTTPS termination and TLS passthrough both consume the SNI of the same
    #   > // port, so they conflict whenever their hostnames can match the same value.
    #   >	if m.isHTTPSAndTLSPassthroughPair(first, second) {
    #   >   if helpers.SNIHostnamesIntersect(
    #   >     helpers.ListenerHostname(first), helpers.ListenerHostname(second),
    #   >   ) {
    #   >     return gatewayv1.ListenerReasonProtocolConflict, true
    #   >   }
    #   >   return "", false
    #   > }
    # REFERENCE: https://github.com/cilium/cilium/blob/main/operator/pkg/gateway-api/status_listener_conflict_test.go#L120-L125
    #   > {
    #   >  name:       "https and tls passthrough wildcard overlap conflict",
    #   >  first:      muxedListener("a", gatewayv1.HTTPSProtocolType, 443, "*.example.com"),
    #   >  second:     tlsPassthroughListener("b", 443, "foo.example.com"),
    #   >  wantReason: gatewayv1.ListenerReasonProtocolConflict,
    #   >  wantOK:     true,
    #   > },
    - name: passthrough
      protocol: TLS
      port: 443
      hostname: connect.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: headscale
      tls:
        mode: Passthrough

    - name: https-accounts
      protocol: HTTPS
      port: 443
      hostname: accounts.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-bnc
      protocol: HTTPS
      port: 443
      hostname: bnc.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-console
      protocol: HTTPS
      port: 443
      hostname: console.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-discover
      protocol: HTTPS
      port: 443
      hostname: discover.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-monitoring
      protocol: HTTPS
      port: 443
      hostname: monitoring.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-music
      protocol: HTTPS
      port: 443
      hostname: music.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-notify
      protocol: HTTPS
      port: 443
      hostname: notify.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-photos
      protocol: HTTPS
      port: 443
      hostname: photos.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: https-wallet
      protocol: HTTPS
      port: 443
      hostname: wallet.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system
