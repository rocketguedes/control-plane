apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All

    # IMPORTANT: Discrete HTTPS listeners are required on port 443 instead of a
    # wildcard (*.guedescloud.com.br) because Headscale uses TLS Passthrough on
    # 443. Cilium rejects overlapping HTTPS termination and TLS passthrough
    # hostnames on the same port with ProtocolConflict.
    # Ref: https://github.com/cilium/cilium/blob/v1.20.5/operator/pkg/gateway-api/status_listener.go
    - name: connect-tls
      protocol: TLS
      port: 443
      hostname: connect.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: headscale
      tls:
        mode: Passthrough

    - name: accounts-https
      protocol: HTTPS
      port: 443
      hostname: accounts.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-guedescloud-com-br-tls
            namespace: kube-system

    - name: bnc-https
      protocol: HTTPS
      port: 443
      hostname: bnc.guedescloud.com.br
      allowedRoutes:
        namespaces:
          from: All
      tls:
